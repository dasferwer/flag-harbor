name: 19-flag-harbor
x-app: &app
  build:
    context: .
    target: runtime
  environment: &environment
    DATABASE_URL: postgresql+asyncpg://flagharbor:flagharbor@database:5432/flagharbor
    JWT_SECRET: ${JWT_SECRET:-local-demo-flagharbor-replace-before-deployment}
  restart: unless-stopped
  init: true
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flagharbor
      POSTGRES_USER: flagharbor
      POSTGRES_PASSWORD: flagharbor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flagharbor -d flagharbor"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  migrate:
    <<: *app
    command: ["sh", "-c", "alembic upgrade head && python scripts/seed.py"]
    depends_on:
      database:
        condition: service_healthy
    restart: "no"
  api:
    <<: *app
    ports:
      - "127.0.0.1:8190:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
  test-db:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: flagharbor_test
      POSTGRES_USER: flagharbor
      POSTGRES_PASSWORD: flagharbor
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flagharbor -d flagharbor_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  test:
    build:
      context: .
      target: test
    profiles: ["test"]
    environment:
      <<: *environment
      DATABASE_URL: postgresql+asyncpg://flagharbor:flagharbor@test-db:5432/flagharbor_test
      TESTING: "true"
    depends_on:
      test-db:
        condition: service_healthy
    init: true
volumes:
  postgres_data:
